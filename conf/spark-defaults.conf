# Local Spark defaults so every process that opens a session — ingestion, dbt, profiling,
# pytest — gets Delta. Without one shared place, Bronze written as Delta would be unreadable
# by dbt, and local would stop matching Databricks in the one way that matters.
#
# Enable with:  export SPARK_CONF_DIR="$PWD/conf"
#
# Coordinates come from Maven Central explicitly: the default resolver also queries
# repos.spark-packages.org, which some networks block, and the failure looks like a Delta
# problem rather than a proxy one.
spark.jars.packages                io.delta:delta-spark_2.13:4.4.0
spark.jars.repositories            https://repo1.maven.org/maven2
spark.sql.extensions               io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog    org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.sql.warehouse.dir            spark-warehouse
spark.ui.enabled                   false
spark.ui.showConsoleProgress       false
spark.sql.shuffle.partitions       8
